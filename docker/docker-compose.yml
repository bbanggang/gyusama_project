services:

  # ── AI 추론 노드 (lane_detect.py → /lane/cmd_vel) ────────────────────
  # camera-node는 호스트 libcamera RPi fork 버전과 컨테이너 버전 불일치로
  # 호스트에서 직접 실행
  inference-node:
    image: bbanggang/gyusama-rpi5:latest
    container_name: inference-node
    network_mode: host
    ipc: host                        # 호스트 /dev/shm 공유 (FastDDS SHM 전송)
    stdin_open: true                 # 's'/'q' 키 입력 수신
    tty: true
    devices:
      - /dev/hailo0:/dev/hailo0      # Hailo-8 NPU PCIe 디바이스 (호스트 DKMS 모듈 사용)
    volumes:
      - ~/gyusama-project/config:/ros2_ws/config          # 재빌드 없이 파라미터 튜닝
      - ~/gyusama-project/models/inference_node:/ros2_ws/models/inference_node  # 코드 핫 리로드
    environment:
      - ROS_DOMAIN_ID=1
      - PYTHONUNBUFFERED=1
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - CAMERA_FLIP=1                  # IMX219 180° 회전 보정 (RPi5 PiSP 파이프라인)
      - CMD_VEL_STAMPED=1              # turtlebot3_node Jazzy: TwistStamped 사용
      - AUTOSTART=${AUTOSTART:-0}      # 1로 설정 시 's' 키 없이 바로 주행 시작
      - INFER_ENGINE=${INFER_ENGINE:-hailo}  # hailo=NPU (Phase 4 이후 기본) | ncnn=CPU (롤백/비교용)
      - YOLO_SZ=${YOLO_SZ:-640}        # hailo=640 / ncnn=320 권장 (HEF·NCNN 모델 메타와 일치)
      - HEF_MODEL=${HEF_MODEL:-}       # 비우면 lane_det*/weights/*.hef 자동 탐색
      - PUBLISH_DEBUG=${PUBLISH_DEBUG:-0}  # 0=디버그 이미지 발행 안 함 (FPS 향상), 1=발행
      - DIRECT_CMD_VEL=${DIRECT_CMD_VEL:-0}  # 1=behavior-node 없이 /cmd_vel 직접 발행 (단독 테스트)
    # INFER_ENGINE 환경변수로 hailo / ncnn 노드 전환 (즉시 롤백 가능)
    command: >
      bash -c "
        if [ \"$${INFER_ENGINE:-hailo}\" = \"hailo\" ]; then
          exec python3 /ros2_ws/models/inference_node/lane_detect_hailo.py
        else
          exec python3 /ros2_ws/models/inference_node/lane_detect_ncnn.py
        fi
      "
    restart: unless-stopped

  # ── LiDAR 장애물 감지 노드 (obstacle_node.py → /obstacle/state) ──────
  obstacle-node:
    image: bbanggang/gyusama-rpi5:latest
    container_name: obstacle-node
    network_mode: host
    ipc: host
    volumes:
      - ~/gyusama-project/config:/ros2_ws/config  # 재빌드 없이 파라미터 튜닝
    environment:
      - ROS_DOMAIN_ID=1
      - PYTHONUNBUFFERED=1
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    command: python3 /ros2_ws/models/inference_node/obstacle_node.py
    restart: unless-stopped

  # ── Behavior Tree 관리 노드 (behavior_manager.py → /cmd_vel) ─────────
  behavior-node:
    image: bbanggang/gyusama-rpi5:latest
    container_name: behavior-node
    network_mode: host
    ipc: host
    volumes:
      - ~/gyusama-project/config:/ros2_ws/config  # 재빌드 없이 파라미터 튜닝
    environment:
      - ROS_DOMAIN_ID=1
      - PYTHONUNBUFFERED=1
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - CMD_VEL_STAMPED=1              # turtlebot3_node Jazzy: TwistStamped 사용
    command: python3 /ros2_ws/models/inference_node/behavior_manager.py
    restart: unless-stopped

  # ── 모터 제어 노드 (Dynamixel / TurtleBot3 bringup) ──────────────────
  control-node:
    image: bbanggang/gyusama-rpi5:latest
    container_name: control-node
    network_mode: host
    privileged: true                  # Dynamixel USB 시리얼 접근 권한
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0    # Dynamixel U2D2 어댑터
    environment:
      - ROS_DOMAIN_ID=1
      - TURTLEBOT3_MODEL=burger
      - LDS_MODEL=LDS-02              # LiDAR 모델: LDS-01 / LDS-02(ld08) / LDS-03
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    command: ros2 launch turtlebot3_bringup robot.launch.py
    restart: unless-stopped
