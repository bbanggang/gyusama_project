# APF(Artificial Potential Field) 파라미터 설정
# 이 파일을 수정하면 재빌드 없이 파라미터를 적용할 수 있습니다.
# obstacle_node.py 와 behavior_manager.py 가 시작 시 이 파일을 로드합니다.
#
# 실물(RPi5) ↔ 시뮬(Isaac Sim) 전환 시 조정 권장 파라미터에 ★ 표시

obstacle_node:
  # 척력 영향권 (m) — 이 거리 밖 포인트는 무시 ★
  influence: 0.65
  # 전방 최소거리 측정 각도 범위 (±deg)
  front_deg: 22
  # 척력 합성 스캔 범위 (±deg)
  scan_half: 90
  # 영향권 내 포인트 수 미만이면 clear 판정 (노이즈 오탐 방지)
  min_obs_points: 5
  # 회피 방향 고정(latch) 트리거 거리 (m) ★
  latch_dist: 0.55
  # latch 해제 디바운스 프레임 수
  release_frames: 2
  # 반대 방위 지속 → 방향 전환 히스테리시스 프레임 수
  flip_frames: 4
  # |fy| 가 이 값 초과면 장애물 방위 신뢰 → fy 부호로 방향 결정
  fy_eps: 0.05
  # Isaac Sim LiDAR 오프셋 (실물=0, Isaac Sim=180)
  # 환경변수 LIDAR_OFFSET_DEG 가 이 값보다 우선합니다
  lidar_offset_deg: 0

behavior_manager:
  # 최대 각속도 제한 (rad/s) — 차선 이탈 방지 ★
  max_angular: 0.5
  # 척력 → 각속도 변환 게인 ★
  k_rep: 0.8
  # 장애물 근접 시 차선 인력 최소 가중치 (0~1)
  lane_min: 0.35
  # 감속 시작 거리 (m) ★
  slow_dist: 0.60
  # 정지 거리 (m) ★
  stop_dist: 0.22
  # /obstacle/state 타임아웃 (초)
  obs_timeout: 0.5

lane_detect:
  # 직선 최대 속도 (m/s) ★
  max_speed: 0.21
  # 커브 최소 속도 (m/s) ★
  min_speed: 0.12
  # 조향 상한 (rad/s)
  max_angular: 12.0
  # 조향 P 게인
  kp_angular: 11.0
  # 검출 신뢰도 임계값
  conf_thresh: 0.12
